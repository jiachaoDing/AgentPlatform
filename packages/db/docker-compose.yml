name: agent-platform

services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: agent_platform
      POSTGRES_USER: agent_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - agent-platform_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_platform -d agent_platform"]
      interval: 3s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  agent-platform_postgres_data:
